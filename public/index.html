<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5f8b">
  <title>Mitarbeiterportal</title>
  <link rel="stylesheet" href="styles.css">

<body>
